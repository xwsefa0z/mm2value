<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM2 Value List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00e676;
        }
        .search-box {
            padding: 10px;
            width: 80%;
            max-width: 400px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: none;
        }
        table {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #1e1e1e;
        }
        th, td {
            padding: 12px;
            border: 1px solid #333;
        }
        th {
            background-color: #2e2e2e;
            color: #00e676;
        }
        tr:hover {
            background-color: #2a2a2a;
        }
    </style>
</head>
<body>

    <h1>Roblox MM2 Value List</h1>
    <input type="text" id="searchInput" class="search-box" onkeyup="searchItem()" placeholder="Eşya ara...">

    <table id="valueTable">
        <thead>
            <tr>
                <th>Eşya Adı</th>
                <th>Değer (Value)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Snowcannon</td>
                <td>675</td>
            </tr>
            <tr>
                <td>Icebreaker</td>
                <td>125</td>
            </tr>
            <tr>
                <td>Harvester</td>
                <td>2400</td>
            </tr>
        </tbody>
    </table>

    <script>
        function searchItem() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let rows = document.getElementById('valueTable').getElementsByTagName('tr');

            for (let i = 1; i < rows.length; i++) {
                let itemName = rows[i].getElementsByTagName('td')[0].innerText.toLowerCase();
                if (itemName.includes(input)) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
